[project]
name = "raqib-api"
version = "0.1.0"
description = "RAQIB / MUSHRIF cloud API: events, bounded agent, ops analytics, forecasting"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-ulid>=2.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "psycopg[binary]>=3.2",
  "sse-starlette>=2.1",
  "pyyaml>=6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "respx>=0.21"]
docs = ["python-docx>=1.1", "python-pptx>=1.0", "matplotlib>=3.9", "nbformat>=5.10", "jupyter>=1.1", "nbconvert>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raqib_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
