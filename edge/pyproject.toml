[project]
name = "raqib-edge"
version = "0.1.0"
description = "RAQIB / MUSHRIF edge pipeline: capture, detect, track, rules, store, sync"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "ultralytics>=8.4,<9",
  "torch>=2.4",
  "torchvision>=0.19",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "pyyaml>=6",
  "shapely>=2.0",
  "httpx>=0.27",
  "python-ulid>=2.7",
  "typer>=0.12",
  "rich>=13",
  "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6"]
train = ["scikit-learn>=1.5", "matplotlib>=3.9", "pandas>=2.2"]
ocr = ["rapidocr-onnxruntime>=1.4", "pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]

[project.scripts]
raqib-edge = "raqib_edge.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raqib_edge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
